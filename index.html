<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Bhawani Shankar — Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#2b3033;font:15px/1.45 "Segoe UI",system-ui,Arial,sans-serif;color:#1f2328;padding:20px}
.card{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:28px 28px 22px;box-shadow:0 10px 40px rgba(0,0,0,.35);border-top:5px solid #c58a35}
.logo{display:block;margin:0 auto 6px;height:96px}
h1{font-family:Georgia,serif;color:#a8722a;text-align:center;font-size:22px;margin:0}
p.sub{text-align:center;color:#6b6b6b;margin:2px 0 20px;font-size:13px;letter-spacing:1.5px;text-transform:uppercase}
label{display:block;font-size:13px;color:#555;margin:0 0 4px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid #d6d0c4;border-radius:9px;margin-bottom:14px}
input:focus{outline:2px solid #c58a35;outline-offset:1px;border-color:#c58a35}
.pw{position:relative}.pw input{padding-right:64px}
.pw button{position:absolute;right:6px;top:6px;border:0;background:#f3efe7;border-radius:7px;padding:5px 9px;font-size:12px;cursor:pointer}
button.go{width:100%;font:inherit;font-weight:600;padding:11px;border:0;border-radius:9px;background:#c58a35;color:#fff;cursor:pointer}
button.go:hover{background:#a8722a}button.go:disabled{opacity:.6;cursor:wait}
.err{min-height:20px;color:#b3261e;font-size:13px;margin:10px 0 0;text-align:center}
.foot{text-align:center;color:#999;font-size:11px;margin-top:14px}
</style></head>

const b64=(s)=>Uint8Array.from(atob(s),(c)=>c.charCodeAt(0));
const tob64=(u)=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function derive(id,pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(id.trim().toLowerCase()+"\n"+pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.salt),iterations:D.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function unlock(key){
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},key,b64(D.ct)));
  sessionStorage.setItem("bsb.k",JSON.stringify({salt:D.salt,k:tob64(await crypto.subtle.exportKey("raw",key))}));
  document.open();document.write(html);document.close();
}
(async()=>{ // still logged in for this tab? (cleared on Logout or when the tab is closed)
  try{const s=JSON.parse(sessionStorage.getItem("bsb.k")||"null");
    if(s&&s.salt===D.salt){await unlock(await crypto.subtle.importKey("raw",b64(s.k),"AES-GCM",true,["decrypt"]));}
  }catch(e){sessionStorage.removeItem("bsb.k");}
})();
document.getElementById("show").onclick=(e)=>{const p=document.getElementById("pw");const h=p.type==="password";p.type=h?"text":"password";e.target.textContent=h?"Hide":"Show";};
document.getElementById("f").onsubmit=async(e)=>{
  e.preventDefault();const go=document.getElementById("go"),err=document.getElementById("err");
  go.disabled=true;go.textContent="Checking…";err.textContent="";
  try{await unlock(await derive(document.getElementById("id").value,document.getElementById("pw").value));}
  catch(x){err.textContent="Galat User ID ya Password";go.disabled=false;go.textContent="Login";document.getElementById("pw").select();}
};
</script>
