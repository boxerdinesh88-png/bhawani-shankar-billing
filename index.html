<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Bhawani Shankar — Billing</title>
<style>body{font:16px/1.5 "Segoe UI",Arial,sans-serif;background:#2b3033;color:#1f2328;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}
.c{background:#fff;border-radius:14px;padding:26px;max-width:520px;border-top:5px solid #c58a35}a,button{font:inherit}button{background:#c58a35;color:#fff;border:0;border-radius:9px;padding:10px 16px;cursor:pointer}</style></head>
<body><div class="c" id="c">Opening the billing software… <a href="https://bhawani-shankar-billing.bhawani-shankar-billing-cloud.workers.dev">https://bhawani-shankar-billing.bhawani-shankar-billing-cloud.workers.dev</a></div>
<script>
const URL_NEW="https://bhawani-shankar-billing.bhawani-shankar-billing-cloud.workers.dev";
let recs=[];try{recs=JSON.parse(localStorage.getItem("bsb.records.v1"))||[];}catch(e){}
const files=()=>new Promise((res)=>{try{const o=indexedDB.open("bsb-files",1);o.onupgradeneeded=()=>o.result.createObjectStore("files");o.onerror=()=>res([]);
  o.onsuccess=()=>{const out=[],tx=o.result.transaction("files","readonly"),st=tx.objectStore("files");st.openCursor().onsuccess=(e)=>{const c=e.target.result;if(c){out.push({key:c.key,...c.value});c.continue();}};tx.oncomplete=()=>res(out);};}catch(e){res([]);}});
const b64=(blob)=>new Promise((r)=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(",")[1]);f.readAsDataURL(blob);});
(async()=>{
  const fl=await files();
  if(!recs.length&&!fl.length)return location.replace(URL_NEW);
  document.getElementById("c").innerHTML="<h2 style='margin-top:0'>The billing software has moved online</h2><p>This browser still has <b>"+recs.length+" record(s)</b> from the old version. Download them, then open the new version and use <b>Records &amp; Dashboard → Restore</b> to add them.</p><p><button id='d'>Download backup of old data</button></p><p><a href='"+URL_NEW+"'>Open the new version →</a></p>";
  document.getElementById("d").onclick=async()=>{
    const data={app:"bsb-billing",version:2,exportedAt:new Date().toISOString(),records:recs,files:await Promise.all(fl.map(async(f)=>({key:f.key,name:f.name,type:f.type,size:f.size,uploadedAt:f.uploadedAt,b64:await b64(f.blob)})))};
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:"application/json"}));a.download="BSB-Billing-Backup_old-version.json";document.body.appendChild(a);a.click();
  };
})();
</script></body></html>
